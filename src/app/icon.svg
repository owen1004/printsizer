<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Paper tray (top) -->
  <rect x="10" y="7" width="12" height="7" rx="1.5" fill="white" opacity="0.85"/>

  <!-- Printer body -->
  <rect x="7" y="12" width="18" height="10" rx="2.5" fill="white"/>

  <!-- Output paper -->
  <rect x="10" y="18" width="12" height="8" rx="1.5" fill="white" opacity="0.9"/>

  <!-- Paper lines -->
  <rect x="12" y="20.5" width="8" height="1.5" rx="0.75" fill="#F97316" opacity="0.55"/>
  <rect x="12" y="23" width="5.5" height="1.5" rx="0.75" fill="#F97316" opacity="0.45"/>

  <!-- Ink dot on printer body -->
  <circle cx="22.5" cy="17" r="1.5" fill="#F97316" opacity="0.7"/>
</svg>
